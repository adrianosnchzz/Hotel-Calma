<div class="contenedor-habitaciones">
  <section *ngFor="let hab of habitaciones; let i = index"
           class="habitacion-section"
           [style.backgroundImage]="'linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url(' + (hab.imagenUrl || hab.foto) + ')'">

    <div class="container-fluid h-100 d-flex justify-content-center align-items-center p-0">
      <div class="panel-info shadow-lg" data-aos="fade-up">

        <div [id]="'carouselHab' + i" class="carousel slide fotos-habitacion" data-bs-ride="carousel">
          <div class="carousel-inner h-100">
            <ng-container *ngIf="hab.fotos && hab.fotos.length > 0">
              <div *ngFor="let f of hab.fotos; let j = index"
                   class="carousel-item h-100" [class.active]="j === 0">
                <img [src]="f" class="d-block w-100 h-100" style="object-fit: cover;" alt="Habitación">
              </div>
            </ng-container>
            <div *ngIf="!hab.fotos || hab.fotos.length === 0" class="carousel-item active h-100">
              <img [src]="hab.imagenUrl || hab.foto" class="d-block w-100 h-100" style="object-fit: cover;" alt="Habitación por defecto">
            </div>
          </div>

          <button class="btn-abrir-foto" (click)="abrirModal(hab, i)">
            <i class="bi bi-fullscreen"></i>
          </button>

          <button class="carousel-control-prev" type="button" [attr.data-bs-target]="'#carouselHab' + i" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" [attr.data-bs-target]="'#carouselHab' + i" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>

        <div class="cuerpo-panel">
          <span class="badge-premium">{{ hab.estado || 'DESTACADO' }}</span>
          <h2 class="titulo-hab">{{ hab.nombre || hab.Nombre || 'Suite Turística' }}</h2>
          <p class="desc-hab">{{ hab.descripcion || 'Sin descripción disponible actualmente.' }}</p>
          
          <div class="servicios">
            <span><i class="bi bi-people"></i> {{ hab.capacidadMaxima || hab.capacidad || 0 }} Personas</span>
            <span><i class="bi bi-wifi"></i> WiFi 6</span>
            <span><i class="bi bi-snow"></i> A/C</span>
          </div>

          <div class="resenas-bloque">
            <app-resena [habitacion]="hab"></app-resena>
          </div>

          <div class="footer-panel">
            <div class="precio-bloque">
              <span class="num">{{ hab.precioBase || hab.precio || 0 }}€</span>
              <span class="txt">/ noche</span>
            </div>
            
            <a href="https://wa.me/34622595670?text=¡Hola!%20Estoy%20interesado%20en%20obtener%20más%20información%20y%20reservar%20la%20habitacion:%20{{hab.nombre || hab.Nombre || 'Suite Calma'}}" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-reserva-pro w-100 d-flex align-items-center justify-content-center gap-2 text-white" 
               style="background: #25D366; text-decoration: none; border: none; text-transform: none;">
              <i class="bi bi-whatsapp"></i> Reservar por WhatsApp
            </a>
          </div>
        </div>

      </div>
    </div>
  </section>
</div>

<div class="modal-foto" *ngIf="modalAbierto" (click)="cerrarModal()">
  <button class="btn-cerrar-modal" (click)="cerrarModal()">
    <i class="bi bi-x-lg"></i>
  </button>
  <div class="modal-foto-inner" (click)="$event.stopPropagation()">
    <img [src]="fotoModal" class="foto-modal-img" alt="Foto ampliada">
    
    <button class="modal-prev" (click)="modalAnterior()" *ngIf="fotosModal.length > 1">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button class="modal-next" (click)="modalSiguiente()" *ngIf="fotosModal.length > 1">
      <i class="bi bi-chevron-right"></i>
    </button>
    
    <div class="modal-indicadores" *ngIf="fotosModal.length > 1">
      <span *ngFor="let f of fotosModal; let j = index"
            [class.activo]="j === indexModal"
            (click)="indexModal = j; fotoModal = fotosModal[j]">
      </span>
    </div>
  </div>
</div>
