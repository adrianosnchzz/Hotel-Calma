<div class="d-flex align-items-center gap-2">

  <!-- SIN SESIÓN -->
  <div *ngIf="!usuarioLogueado" class="d-flex gap-2">
    <button class="btn btn-outline-light border-0 fw-bold small"
      (click)="esLogin = false; abrirModal()">
      <i class="bi bi-person-plus"></i> Registrarse
    </button>
    <button class="btn btn-light px-4 shadow-sm fw-bold small text-dark"
      (click)="esLogin = true; abrirModal()">
      <i class="bi bi-box-arrow-in-right"></i> Entrar
    </button>
  </div>

  <!-- CON SESIÓN -->
  <div *ngIf="usuarioLogueado"
       class="cuenta-trigger"
       [class.abierto]="dropdownAbierto"
       (click)="$event.stopPropagation(); toggleDropdown()">

    <div class="cuenta-avatar-sm">
      {{ (usuarioLogueado.nombre || 'U').charAt(0).toUpperCase() }}
    </div>
    <span class="cuenta-nombre-nav">{{ usuarioLogueado.nombre }}</span>
    <i class="bi bi-chevron-down cuenta-chevron"></i>

    <!-- DROPDOWN -->
    <div class="cuenta-dropdown" (click)="$event.stopPropagation()">

      <div class="dropdown-perfil">
        <div class="dropdown-avatar-grande">
          {{ (usuarioLogueado.nombre || 'U').charAt(0).toUpperCase() }}
        </div>
        <div class="dropdown-perfil-info">
          <span class="dp-nombre">{{ usuarioLogueado.nombre }}</span>
          <span class="dp-email">{{ usuarioLogueado.email }}</span>
        </div>
      </div>

      <div class="dropdown-sep"></div>

      <a class="dropdown-opcion" routerLink="/mi-cuenta" (click)="cerrarDropdown()">
        <span class="opcion-icono"><i class="bi bi-person-lines-fill"></i></span>
        <span class="opcion-texto">
          <strong>Mi cuenta</strong>
          <small>Datos personales y reservas</small>
        </span>
        <i class="bi bi-chevron-right opcion-arrow"></i>
      </a>

      <div class="dropdown-sep"></div>

      <button class="dropdown-opcion logout" (click)="logout(); cerrarDropdown()">
        <span class="opcion-icono"><i class="bi bi-box-arrow-right"></i></span>
        <span class="opcion-texto">
          <strong>Cerrar sesión</strong>
        </span>
      </button>

    </div>
  </div>

</div>

<!-- MODAL LOGIN / REGISTRO -->
<div class="modal-overlay" *ngIf="modalAbierto" (click)="cerrarModal()">
  <div class="modal-content text-start" (click)="$event.stopPropagation()">

    <button class="btn-cerrar" (click)="cerrarModal()">✕</button>

    <div class="tabs">
      <button [class.activo]="esLogin" (click)="esLogin = true">Iniciar Sesión</button>
      <button [class.activo]="!esLogin" (click)="esLogin = false">Registrarse</button>
    </div>

    <form (ngSubmit)="confirmar()" #authForm="ngForm">
      <div *ngIf="!esLogin">
        <div class="grupo-input">
          <label>Nombre completo</label>
          <input type="text" name="nombre" [(ngModel)]="usuario.nombre" required>
        </div>
        <div class="grupo-input">
          <label>DNI / Pasaporte</label>
          <input type="text" name="dni" [(ngModel)]="usuario.dni" required>
        </div>
      </div>
      <div class="grupo-input">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="usuario.email" required email>
      </div>
      <div class="grupo-input">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="usuario.password" required minlength="6">
      </div>
      <button type="submit" class="btn-confirmar" [disabled]="authForm.invalid || procesando">
        <span *ngIf="!procesando">{{ esLogin ? 'Iniciar Sesión' : 'Crear Cuenta' }}</span>
        <span *ngIf="procesando">{{ esLogin ? 'Entrando...' : 'Creando cuenta...' }}</span>
      </button>
    </form>
  </div>
</div>
